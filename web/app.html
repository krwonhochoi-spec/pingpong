<title>건강지키미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Gradient header band, colour-coded tiles (체중 coral · 혈압 rose · 운동 sky · 생활 teal · 달력 violet), raised 3D buttons, 5-tab bottom bar. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --sunk:#ECEFF6; --ink:#1B2233; --muted:#5B6578; --line:#DCE1EC;
  --hd1:#3B4FD8; --hd2:#0FA7A0; --hd-ink:#FFFFFF;
  /* 타일 색: 글자·아이콘용(테마별) */
  --c-w:#D9502A; --c-v:#CC2F63; --c-e:#1B73CF; --c-h:#0B8D6E; --c-c:#7244D3; --c-i:#3B4FD8; --c-r:#B07800;
  /* 버튼 바탕(양 테마 공통, 흰 글자 대비 확보) */
  --b-w:#DD5329; --b-v:#CF2E62; --b-e:#1C7AD6; --b-h:#0C9273; --b-c:#7243D6; --b-i:#3B4FD8; --b-r:#C98A00;
  --soft-top:#FFFFFF; --soft-bot:#E9EDF5; --soft-edge:#C3CBDA;
  --s2:#1C7AD6; --ma:#8E98AB;
  --g-blue:#2F67B0; --g-green:#1E8A4C; --g-lime:#638A12; --g-yellow:#9A7200; --g-orange:#C2541A; --g-red:#B8322A; --g-deep:#86193B;
  --k-warn:#FFEADC; --k-good:#DCF3E6; --k-info:#E2E9FB; --k-care:#EEF0F4;
  --sun:#D2342C; --sat:#2F62C8;
  --f-display:"Jua","Gowun Dodum",sans-serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D111A; --surface:#161C28; --sunk:#1F2635; --ink:#E9EDF6; --muted:#9CA6BA; --line:#2A3244;
  --hd1:#2C3AA8; --hd2:#0B7F7A; --hd-ink:#FFFFFF;
  --c-w:#FF8C66; --c-v:#FF6E99; --c-e:#62AEF7; --c-h:#3ACFA4; --c-c:#AE8CFA; --c-i:#8C9CFF; --c-r:#F2BE48;
  --soft-top:#283044; --soft-bot:#1E2534; --soft-edge:#0B0E15;
  --s2:#62AEF7; --ma:#6E788C;
  --g-blue:#7FA8E6; --g-green:#5CC28A; --g-lime:#A9C75A; --g-yellow:#E0B840; --g-orange:#F08B4E; --g-red:#F06A60; --g-deep:#E5739A;
  --k-warn:#3A2416; --k-good:#143223; --k-info:#1B2540; --k-care:#20273A;
  --sun:#FF7A72; --sat:#7FA8F5;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#161C28; --sunk:#1F2635; --ink:#E9EDF6; --muted:#9CA6BA; --line:#2A3244;
  --hd1:#2C3AA8; --hd2:#0B7F7A; --hd-ink:#FFFFFF;
  --c-w:#FF8C66; --c-v:#FF6E99; --c-e:#62AEF7; --c-h:#3ACFA4; --c-c:#AE8CFA; --c-i:#8C9CFF; --c-r:#F2BE48;
  --soft-top:#283044; --soft-bot:#1E2534; --soft-edge:#0B0E15;
  --s2:#62AEF7; --ma:#6E788C;
  --g-blue:#7FA8E6; --g-green:#5CC28A; --g-lime:#A9C75A; --g-yellow:#E0B840; --g-orange:#F08B4E; --g-red:#F06A60; --g-deep:#E5739A;
  --k-warn:#3A2416; --k-good:#143223; --k-info:#1B2540; --k-care:#20273A;
  --sun:#FF7A72; --sat:#7FA8F5;
  color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-i);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
/* 머리띠 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px 6px;background:var(--bg)}
.top-in{background:linear-gradient(120deg,var(--hd1),var(--hd2));color:var(--hd-ink);border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 20px -10px color-mix(in srgb,var(--hd1) 70%,transparent)}
.top h1{font-family:var(--f-display);font-size:1.25rem;margin:0;font-weight:400;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.top h1 span{overflow:hidden;text-overflow:ellipsis}
.top h1 svg{width:26px;height:26px;flex:none}
.top .date{font-size:.85rem;font-weight:600;white-space:nowrap;background:rgb(255 255 255/.2);padding:4px 10px;border-radius:999px}
main{display:flex;flex-direction:column;gap:16px;padding-top:10px}
h2{font-size:1.1rem;margin:0;font-weight:400;font-family:var(--f-display);letter-spacing:.01em}
h3{font-size:.95rem;margin:0;font-weight:600}
/* 타일 색 체계 */
.t-w{--tc:var(--c-w);--tb:var(--b-w)}.t-v{--tc:var(--c-v);--tb:var(--b-v)}.t-e{--tc:var(--c-e);--tb:var(--b-e)}.t-h{--tc:var(--c-h);--tb:var(--b-h)}
.t-c{--tc:var(--c-c);--tb:var(--b-c)}.t-i{--tc:var(--c-i);--tb:var(--b-i)}.t-r{--tc:var(--c-r);--tb:var(--b-r)}
main,.sheet-card{--tc:var(--c-i);--tb:var(--b-i)}
.tile{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 9%,var(--surface)) 0,var(--surface) 96px);border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 10%,transparent)}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.th{display:flex;align-items:center;gap:10px;min-width:0}
.th h2{color:var(--tc)}
.ib{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--tb) 70%,#fff),var(--tb));box-shadow:0 3px 0 color-mix(in srgb,var(--tb) 60%,#000)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.src{font-size:.75rem;color:var(--muted);letter-spacing:.01em}
.when{font-size:.85rem;color:var(--muted)}
.readout{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.num{font-size:2.7rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.num.mid{font-size:2.2rem}
.num .sl{color:var(--tc);font-weight:500}
.unit{color:var(--muted);font-size:1rem}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:.95rem}
.meta-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);border:1px solid color-mix(in srgb,var(--pc) 30%,transparent);white-space:nowrap}
.c-blue{--pc:var(--g-blue)}.c-green{--pc:var(--g-green)}.c-lime{--pc:var(--g-lime)}.c-yellow{--pc:var(--g-yellow)}.c-orange{--pc:var(--g-orange)}.c-red{--pc:var(--g-red)}.c-deep{--pc:var(--g-deep)}.c-violet{--pc:var(--c-c)}
.delta{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 9px;border-radius:9px}
.delta.up{color:var(--g-orange);background:color-mix(in srgb,var(--g-orange) 14%,transparent)}
.delta.down{color:var(--g-green);background:color-mix(in srgb,var(--g-green) 14%,transparent)}
.delta.flat{color:var(--muted);background:var(--sunk)}
.empty{color:var(--muted);margin:0}
/* 입체 버튼 */
.btn{--bc:var(--tb);min-height:50px;margin-bottom:4px;border:0;border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,var(--soft-top),var(--soft-bot));
  box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 4px 0 var(--soft-edge),0 8px 14px -6px rgb(0 0 0/.25);transition:transform .06s,box-shadow .06s}
.btn.primary{color:#fff;text-shadow:0 1px 0 rgb(0 0 0/.18);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 72%,#fff) 0%,var(--bc) 52%,color-mix(in srgb,var(--bc) 86%,#000) 100%);
  box-shadow:inset 0 1px 0 rgb(255 255 255/.4),0 4px 0 color-mix(in srgb,var(--bc) 58%,#000),0 10px 16px -6px color-mix(in srgb,var(--bc) 55%,transparent)}
.btn:active,.step:active{transform:translateY(3px)}
.btn:active{box-shadow:inset 0 1px 0 rgb(255 255 255/.3),0 1px 0 var(--soft-edge),0 3px 6px -3px rgb(0 0 0/.25)}
.btn.primary:active{box-shadow:inset 0 1px 0 rgb(255 255 255/.3),0 1px 0 color-mix(in srgb,var(--bc) 58%,#000),0 3px 6px -3px color-mix(in srgb,var(--bc) 55%,transparent)}
.btn.big{min-height:58px;font-size:1.12rem;width:100%}
.btn.sm{min-height:42px;padding:6px 14px;font-size:.92rem}
.btn.ghost{background:transparent;box-shadow:none;color:var(--tc);text-decoration:underline;text-underline-offset:3px;margin-bottom:0}
.btn[aria-pressed="true"]:not(.primary){color:var(--tc)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px;white-space:nowrap}
.bar{height:14px;border-radius:999px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 2px 3px rgb(0 0 0/.12)}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--tb) 60%,#fff),var(--tb))}
.spark{width:100%;height:46px;display:block}
.spark path{fill:none;stroke:var(--tc);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--tc)}
.msg{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.msg p{margin:0}
.msg .msg-t{font-family:var(--f-display);font-size:1.15rem}
.msg .msg-s{font-size:.8rem;color:var(--muted)}
.k-warn{background:var(--k-warn)}.k-warn .msg-t{color:var(--g-orange)}
.k-good{background:var(--k-good)}.k-good .msg-t{color:var(--g-green)}
.k-info{background:var(--k-info)}.k-info .msg-t{color:var(--g-blue)}
.k-care{background:var(--k-care);border:1px solid var(--line)}
.celebrate{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(125deg,#7243D6,#CF2E62 60%,#DD5329);display:flex;gap:14px;align-items:center;box-shadow:0 10px 22px -12px #7243D6}
.celebrate svg{width:44px;height:44px;flex:none;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.celebrate b{font-family:var(--f-display);font-size:1.25rem;font-weight:400;display:block}
.celebrate span{font-size:.92rem;opacity:.95}
.banner{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--c-r) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c-r) 30%,transparent);display:flex;flex-direction:column;gap:8px;font-size:.95rem;--tb:var(--b-r)}
.banner.demo{background:var(--k-info);border-color:color-mix(in srgb,var(--c-i) 30%,transparent);--tb:var(--b-i)}
/* 선택 컨트롤 */
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:5px;gap:5px;flex-wrap:wrap;box-shadow:inset 0 2px 4px rgb(0 0 0/.08)}
.seg label{flex:1 1 0;min-width:max-content;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;padding:4px 10px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:.95rem;white-space:nowrap}
.seg input:checked+span{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tb) 75%,#fff),var(--tb));box-shadow:0 3px 0 color-mix(in srgb,var(--tb) 58%,#000)}
.seg input:focus-visible+span{outline:3px solid var(--tc)}
.segb{display:flex;background:var(--sunk);border-radius:14px;padding:5px;gap:5px;overflow-x:auto;box-shadow:inset 0 2px 4px rgb(0 0 0/.08)}
.segb button{flex:1 0 auto;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted);padding:4px 12px;cursor:pointer}
.segb button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tb) 75%,#fff),var(--tb));box-shadow:0 3px 0 color-mix(in srgb,var(--tb) 58%,#000)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;min-height:44px;align-items:center;padding:6px 14px;border-radius:999px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,var(--soft-top),var(--soft-bot));box-shadow:0 3px 0 var(--soft-edge);margin-bottom:3px}
.chips input:checked+span{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tb) 75%,#fff),var(--tb));box-shadow:0 3px 0 color-mix(in srgb,var(--tb) 58%,#000)}
.chips input:focus-visible+span{outline:3px solid var(--tc)}
/* 입력 */
form.entry{display:flex;flex-direction:column;gap:14px}
.prev{font-size:.95rem;color:var(--muted)}
.prev b{color:var(--tc);font-variant-numeric:tabular-nums}
.dial{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dial-val{grid-column:1/-1;display:flex;align-items:baseline;justify-content:center;gap:6px;border-radius:var(--r);padding:10px 12px;background:color-mix(in srgb,var(--tc) 9%,var(--sunk));box-shadow:inset 0 3px 6px rgb(0 0 0/.1)}
.dial-val input{width:6.2ch;border:0;background:transparent;text-align:center;font-size:3.1rem;font-weight:700;font-variant-numeric:tabular-nums;padding:0;color:var(--tc)}
.dial-val span{font-size:1.1rem;color:var(--muted)}
.step{min-height:52px;margin-bottom:4px;border-radius:14px;border:0;font-weight:800;font-size:1.05rem;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--tc);background:linear-gradient(180deg,var(--soft-top),var(--soft-bot));box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 4px 0 var(--soft-edge),0 8px 12px -6px rgb(0 0 0/.22);transition:transform .06s}
.step:active{box-shadow:0 1px 0 var(--soft-edge)}
.stps{display:flex;flex-direction:column;gap:8px}
.stp{display:grid;grid-template-columns:minmax(4.2em,1fr) 52px minmax(0,5.5em) 52px 3.2em;align-items:center;gap:8px}
.stp-l{font-weight:700}
.stp input{width:100%;min-height:52px;border:0;border-radius:14px;background:color-mix(in srgb,var(--tc) 8%,var(--sunk));box-shadow:inset 0 3px 6px rgb(0 0 0/.1);text-align:center;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stp .step{font-size:1.4rem}
.stp-u{color:var(--muted);font-size:.85rem}
.preview{min-height:1.6em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem}
.preview b{color:var(--ink);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.85rem;color:var(--muted);font-weight:600}
.field input,.field select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;width:100%;min-width:0;box-shadow:inset 0 2px 3px rgb(0 0 0/.06)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.warnline{border-radius:12px;padding:10px 12px;background:var(--k-warn);color:var(--ink);font-size:.95rem}
details.guide{background:color-mix(in srgb,var(--tc) 7%,var(--sunk));border-radius:12px;padding:10px 14px;font-size:.92rem}
details.guide summary{cursor:pointer;font-weight:700;color:var(--tc)}
details.guide ul{margin:8px 0 0;padding-left:1.2em}
/* 차트 */
.chart-wrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--f-body)}
.chart .band{fill:color-mix(in srgb,var(--c-h) 14%,transparent)}
.chart .ref{stroke:var(--g-orange);stroke-dasharray:4 4;stroke-width:1.2}
.chart .ref-t{fill:var(--g-orange);font-size:10px;font-family:var(--f-body)}
.chart .goal{stroke:var(--g-green)}
.chart .goal-t{fill:var(--g-green)}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .s-a{stroke:var(--tc)}.chart .f-a{fill:var(--tc)}
.chart .s-b{stroke:var(--s2)}.chart .f-b{fill:var(--s2)}
.chart .s-ma{stroke:var(--ma);stroke-dasharray:5 4;stroke-width:1.6}
.chart .wh{stroke-width:1.4;opacity:.55}
.chart .bars{fill:var(--tc)}
.chart .bv{fill:var(--ink);font-size:9.5px;font-family:var(--f-body)}
.chart .none{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navrow b{font-weight:700;font-family:var(--f-display);font-size:1.15rem;font-weight:400;color:var(--tc)}
.navbtn{min-width:48px;min-height:44px;margin-bottom:4px;border-radius:12px;border:0;font-size:1.3rem;font-weight:700;cursor:pointer;color:var(--tc);background:linear-gradient(180deg,var(--soft-top),var(--soft-bot));box-shadow:0 3px 0 var(--soft-edge)}
.navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--soft-edge)}
.navbtn:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 2px 0 var(--line)}
.stat span{font-size:.8rem;color:var(--muted)}
.stat b{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tc)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.hist li:last-child{border-bottom:0}
.hist .h-main{display:flex;flex-direction:column;min-width:0}
.hist .h-v{font-weight:700;font-variant-numeric:tabular-nums}
.hist .h-s{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.x{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;border-radius:10px}
.x:hover{background:var(--sunk)}
.tbl-wrap{overflow-x:auto;position:relative}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{color:var(--muted);font-weight:600;font-size:.8rem}
/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .wd.sun{color:var(--sun)}.cal .wd.sat{color:var(--sat)}
.cd{min-height:58px;border:0;border-radius:12px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;background:var(--surface);box-shadow:0 2px 0 var(--line);min-width:0;color:var(--ink)}
