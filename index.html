<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="탁구사랑 클럽">
<meta name="format-detection" content="telephone=no">
<title>암사동 탁구사랑 클럽</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Tailwind CSS (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js 4.4.1 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  :root { --h:#38bdf8; --w:#fb7185; --d:#a3a3a3; color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  body { touch-action: manipulation; font-family: "Pretendard", "SamsungOne", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; background:#020617; color:#f1f5f9; -webkit-text-size-adjust:100%; }
  .card { background:#0f172a; border:1px solid #1e293b; border-radius:1rem; }
  .inp { width:100%; background:#020617; border:1px solid #334155; border-radius:.75rem; padding:.6rem .75rem; color:#f1f5f9; font-size:16px; min-height:48px; }
  .inp:focus { outline:none; border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.25); }
  input[type=date].inp { color-scheme: dark; }
  .fld { display:flex; flex-direction:column; gap:.35rem; font-size:.82rem; color:#94a3b8; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.35rem; min-height:48px; padding:.5rem .9rem; border-radius:.8rem; background:#1e293b; color:#e2e8f0; font-weight:700; border:1px solid #334155; transition:transform .06s, background .15s; user-select:none; -webkit-user-select:none; }
  .btn:active { transform:scale(.95); background:#334155; }
  .btn:disabled { opacity:.38; pointer-events:none; }
  .btn-primary { background:#0284c7; border-color:#0ea5e9; color:#fff; }
  .btn-primary:active { background:#0369a1; }
  .btn-ok { background:#059669; border-color:#10b981; color:#fff; }
  .btn-ok:active { background:#047857; }
  .btn-danger { background:#9f1239; border-color:#e11d48; color:#fff; }
  .btn-sm { min-height:40px; padding:.3rem .7rem; font-size:.85rem; border-radius:.65rem; }
  .icon-btn { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:.8rem; background:#1e293b; border:1px solid #334155; font-size:1.15rem; flex:none; }
  .icon-btn:active { transform:scale(.94); }
  .seg { display:inline-flex; background:#020617; border:1px solid #334155; border-radius:.8rem; padding:3px; gap:3px; flex-wrap:wrap; }
  .seg-btn { min-height:42px; padding:.3rem .75rem; border-radius:.6rem; color:#94a3b8; font-weight:700; font-size:.9rem; }
  .seg-btn.on { background:#1e293b; color:#fff; box-shadow: inset 0 0 0 1px #475569; }
  .chip { display:inline-flex; align-items:center; gap:.35rem; padding:.3rem .7rem; border-radius:999px; font-size:.78rem; font-weight:700; border:1px solid #334155; background:#0f172a; white-space:nowrap; }
  .avatar { display:inline-block; vertical-align:middle; }
  /* 결과 입력 패널 */
  .panel { border-radius:1.1rem; overflow:hidden; display:flex; flex-direction:column; border:2px solid transparent; transition: box-shadow .2s, border-color .2s; }
  .panel-h { background:linear-gradient(160deg,#0c4a6e,#082f49); }
  .panel-w { background:linear-gradient(160deg,#881337,#4c0519); }
  .panel.win-h { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.25), 0 0 28px rgba(56,189,248,.3); }
  .panel.win-w { border-color:#fb7185; box-shadow:0 0 0 3px rgba(251,113,133,.25), 0 0 28px rgba(251,113,133,.3); }
  .score-num { font-size:clamp(4.2rem, 25vw, 8.5rem); line-height:1; font-weight:900; font-variant-numeric:tabular-nums; text-shadow:0 6px 24px rgba(0,0,0,.35); }
  .score-btn { flex:1; min-height:60px; font-size:1.75rem; font-weight:900; border-radius:.9rem; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12); color:#fff; user-select:none; -webkit-user-select:none; }
  .score-btn:active { transform:scale(.94); background:rgba(0,0,0,.45); }
  .pop { animation: pop .22s ease-out; }
  @keyframes pop { 0%{transform:scale(1.15)} 100%{transform:scale(1)} }
  /* 캘린더 */
  .cal-cell { position:relative; aspect-ratio:1/1; border-radius:.7rem; display:flex; align-items:center; justify-content:center; background:#0b1222; border:1px solid #162033; overflow:hidden; }
  @media (min-width:600px) and (max-width:1023px){ .cal-cell { aspect-ratio: 5/4; } }
  .cal-cell.out { opacity:.35; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px #facc15; }
  .cal-cell.win-h { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.4); }
  .cal-cell.win-w { background:rgba(251,113,133,.16); border-color:rgba(251,113,133,.4); }
  .cal-cell.win-d { background:rgba(163,163,163,.12); border-color:rgba(163,163,163,.3); }
  .cal-num-sm { position:absolute; top:1px; left:4px; font-size:9.5px; color:#cbd5e1; font-weight:700; text-shadow:0 1px 2px #000; z-index:1; }
  .cal-av { width:78%; height:78%; display:flex; align-items:center; justify-content:center; font-size:clamp(1.2rem, 6vw, 1.9rem); }
  .cal-av svg { width:100%; height:100%; }
  .cal-badges { position:absolute; bottom:0; right:2px; font-size:10px; line-height:1; z-index:1; }
  /* 모달 & 토스트 */
  .modal-wrap { position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-wrap { align-items:center; padding:1.5rem; } }
  .modal-backdrop { position:absolute; inset:0; background:rgba(2,6,23,.75); }
  .modal-card { position:relative; width:100%; max-height:90dvh; overflow:auto; overscroll-behavior:contain; background:#0f172a; border:1px solid #1e293b; border-radius:1.25rem 1.25rem 0 0; padding-bottom:env(safe-area-inset-bottom); animation: up .2s ease-out; }
  @media (min-width:640px){ .modal-card { border-radius:1.25rem; } }
  @keyframes up { from { transform:translateY(24px); opacity:0 } to { transform:none; opacity:1 } }
  .toast { padding:.7rem 1rem; border-radius:.8rem; font-size:.92rem; font-weight:700; background:#1e293b; border:1px solid #334155; box-shadow:0 10px 30px rgba(0,0,0,.4); transition:opacity .3s; text-align:center; }
  .toast-ok { background:#064e3b; border-color:#10b981; }
  .toast-warn { background:#713f12; border-color:#eab308; }
  .toast-error { background:#7f1d1d; border-color:#ef4444; }
  .tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:.5rem 0 .45rem; font-size:.74rem; color:#94a3b8; font-weight:700; min-height:58px; justify-content:center; }
  .tab-btn .ti { font-size:1.4rem; line-height:1; }
  .tab-btn.on { color:#fff; }
  .tab-btn.on .ti { transform:scale(1.08); }
  @media (min-width:1024px){
    .tab-btn { flex-direction:row; gap:.4rem; font-size:.9rem; padding:.55rem .75rem; border-radius:.7rem; min-height:44px; }
    .tab-btn .ti { font-size:1.1rem; }
    .tab-btn.on { background:#1e293b; }
  }
  .kpi-bar { height:8px; border-radius:999px; background:#1e293b; overflow:hidden; display:flex; }
</style>
</head>
<body class="min-h-screen">

<!-- ===================== 헤더 ===================== -->
<header class="sticky top-0 z-30 bg-slate-950/95 border-b border-slate-800" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center gap-2">
    <div class="min-w-0 flex-1 flex items-center gap-2"><span class="text-2xl leading-none flex-none">🏓</span><div class="min-w-0 leading-tight"><div class="text-[11px] font-bold text-slate-400 tracking-wide">암사동</div><div class="font-extrabold text-[17px] tracking-tight truncate">탁구사랑 클럽</div></div></div>
    <button id="btnInstall" hidden class="chip flex-none text-sky-300 border-sky-500/50" aria-label="홈 화면에 설치">📲<span class="hidden min-[400px]:inline">설치</span></button>
    <button id="syncChip" class="chip flex-none max-w-[30vw] overflow-hidden text-ellipsis" title="동기화 상태">📱 로컬</button>
    <button id="btnSettings" class="icon-btn" aria-label="설정">⚙️</button>
  </div>
</header>

<div id="sampleBanner" hidden class="max-w-7xl mx-auto px-3 sm:px-4 pt-3">
  <div class="rounded-xl border border-amber-500/40 bg-amber-500/10 px-3 py-2 text-[13px] text-amber-200 flex items-center gap-2">
    <span class="flex-1">🧪 샘플 데이터 표시 중 — 설정에서 시트 연결 또는 샘플 삭제</span>
    <button id="btnClearSample" class="btn btn-sm">샘플 삭제</button>
  </div>
</div>

<div class="max-w-7xl mx-auto px-3 sm:px-4 pt-3 pb-28 lg:pb-10 lg:grid lg:grid-cols-[360px_minmax(0,1fr)] xl:grid-cols-[400px_minmax(0,1fr)] lg:gap-6">

  <!-- ===================== 상단: 승리 캐릭터 캘린더 ===================== -->
  <aside class="lg:sticky lg:top-20 lg:self-start mb-3 lg:mb-0">
    <div class="card p-2.5 sm:p-4">
      <div class="flex items-center gap-2 mb-2">
        <button id="calPrev" class="icon-btn" aria-label="이전 달">‹</button>
        <div class="flex-1 text-center min-w-0">
          <div id="calTitle" class="text-lg font-extrabold">-</div>
          <div id="calSummary" class="text-[11px] text-slate-400 truncate">-</div>
        </div>
        <button id="calNext" class="icon-btn" aria-label="다음 달">›</button>
      </div>
      <div class="flex items-center justify-between mb-2 gap-2">
        <button id="calToday" class="btn btn-sm">오늘</button>
        <div id="calLegend" class="text-[11px] text-slate-400 flex items-center gap-2 min-w-0 overflow-hidden"></div>
        <button id="calToggle" class="btn btn-sm whitespace-nowrap">접기 ▴</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-500 mb-1">
        <div class="text-rose-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-sky-400">토</div>
      </div>
      <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
    </div>
  </aside>

  <main class="min-w-0">
    <!-- 탭 (모바일: 하단 고정 / 태블릿 가로·PC: 상단) -->
    <nav id="tabs" class="fixed bottom-0 inset-x-0 z-30 bg-slate-950/95 border-t border-slate-800 flex lg:static lg:bg-slate-900 lg:border lg:rounded-2xl lg:p-1 lg:mb-4 lg:gap-1" style="padding-bottom:env(safe-area-inset-bottom)">
      <button class="tab-btn on" data-tab="score"><span class="ti">🏓</span>탁구 사랑</button>
      <button class="tab-btn" data-tab="stats"><span class="ti">📊</span>통계</button>
      <button class="tab-btn" data-tab="history"><span class="ti">🗂️</span>기록 관리</button>
    </nav>

    <!-- ===================== 메인: 경기 결과 입력 ===================== -->
    <section id="tab-score" class="space-y-3">
      <!-- 경기일 -->
      <div class="card p-3">
        <div class="flex items-center gap-2">
          <span class="text-xl flex-none" aria-label="경기일">📅</span>
          <input type="date" id="eDate" class="inp !min-h-[44px] !py-1.5 flex-1 min-w-0">
          <button id="eToday" class="btn btn-sm !px-2.5">오늘</button>
          <button id="eYest" class="btn btn-sm !px-2.5">어제</button>
        </div>
      </div>

      <!-- 최종 세트 스코어 -->
      <div class="card p-3 space-y-3">
        <div class="flex items-center gap-2">
          <div class="flex-1 min-w-0">
            <h2 class="font-extrabold text-base">🏓 최종 세트 스코어</h2>
            <p id="eRule" class="text-[11px] text-slate-400"></p>
          </div>
          <button id="eReset" class="btn btn-sm whitespace-nowrap">↺ <span data-base></span> : <span data-base></span></button>
        </div>
        <div id="eBoard" class="grid grid-cols-2 gap-2.5"></div>
        <div id="eStatus" class="text-center text-[15px] font-extrabold min-h-[22px]"></div>
      </div>

      <div class="card p-3 space-y-2">
        <input id="eMemo" class="inp" maxlength="200" placeholder="메모 (선택)" enterkeyhint="done">
        <button id="eSave" class="btn btn-primary w-full !min-h-[60px] text-lg">💾 경기 결과 저장</button>
        <p class="text-[11px] text-slate-500 text-center">세트 수를 누르면 0~<span data-base></span> 선택표가 열립니다</p>
      </div>
    </section>

    <!-- ===================== 통계 ===================== -->
    <section id="tab-stats" hidden class="space-y-3">
      <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3"></div>
      <div id="kpis2" class="grid grid-cols-2 xl:grid-cols-4 gap-3"></div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-sm text-slate-400">그래프 범위</span>
        <div class="seg" id="segRange">
          <button class="seg-btn" data-v="30">최근 30</button>
          <button class="seg-btn on" data-v="60">최근 60</button>
          <button class="seg-btn" data-v="0">전체</button>
        </div>
      </div>
      <div class="card p-3 sm:p-4">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <h3 class="font-bold flex-1">📈 승률 추이</h3>
          <div class="seg" id="segWr">
            <button class="seg-btn on" data-v="10">10전 이동</button>
            <button class="seg-btn" data-v="30">30전 이동</button>
            <button class="seg-btn" data-v="cum">누적</button>
          </div>
        </div>
        <div class="h-64 sm:h-72"><canvas id="chWin"></canvas></div>
      </div>
      <div class="card p-3 sm:p-4">
        <h3 class="font-bold mb-1">📊 경기별 세트 차이 & 이동평균</h3>
        <p id="diffNote" class="text-[11px] text-slate-400 mb-3"></p>
        <div class="h-64 sm:h-72"><canvas id="chDiff"></canvas></div>
      </div>
      <p id="chartNotice" hidden class="text-sm text-amber-300"></p>
    </section>

    <!-- ===================== 기록 관리 (CRUD) ===================== -->
    <section id="tab-history" hidden class="space-y-3">
      <div class="card p-3 space-y-2">
        <div class="flex gap-2">
          <select id="hMonth" class="inp flex-1 min-w-0"></select>
          <button id="bBackdate" class="btn btn-primary whitespace-nowrap">＋ 소급 입력</button>
        </div>
      </div>
      <div id="hCount" class="text-xs text-slate-400 px-1"></div>
      <div id="hList" class="space-y-3"></div>
      <div class="text-center"><button id="hMore" hidden class="btn">더 보기</button></div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="fixed z-[200] left-1/2 -translate-x-1/2 bottom-24 lg:bottom-6 flex flex-col items-center gap-2 pointer-events-none w-[min(92vw,420px)]"></div>

<script>
'use strict';
/* =====================================================================
 * 캐릭터 (오리지널 SVG 아바타 — 젊은 동양인 할머니/할아버지)
 * ===================================================================== */
const SKIN = '#F6D3B0', SKIN_D = '#EBBE95', INK = '#2A211C';
const BLACK = '#1E1B19', SHEEN = '#46403B', LIP = '#C4545A';
const FACE_OVAL = `<ellipse cx="32" cy="31.4" rx="13.6" ry="15" fill="${SKIN}"/>`;
/* 각진 얼굴(할아버지): 넓은 이마·각진 턱 */
const FACE_SQUARE = `<path d="M18.6 23.4C18.6 18.4 22 15.6 26.6 15.6h10.8c4.6 0 8 2.8 8 7.8v12c0 5.6-3.4 10.4-9.2 10.8h-8.4c-5.8-.4-9.2-5.2-9.2-10.8z" fill="${SKIN}"/>`;
const AV = {
  grandpa: {
    label: '할아버지 (라운드 안경·3:7 가르마)', body: '#3E5C7A', faceShape: FACE_SQUARE,
    // 풍성한 검은 머리 · 왼쪽 30% 지점 가르마, 70% 쪽은 오른쪽으로 볼륨 있게 넘김
    hair: `<path d="M17 29.4C15 17.4 21.6 7.6 32.4 7.6c11.4 0 17.8 8 15.4 19.6-.8-2.6-1.8-4.6-3.2-5.8-3.6 1.4-8.6.8-12.4-1.2-2.4-1.2-4.2-2.8-5-4.6-.8 2.6-2.6 4.4-5.2 5.4-1.6.6-2.8 1.8-3.4 3.4-.6 1.4-1.2 2.8-1.6 5z" fill="${BLACK}"/>
      <path d="M27.4 8.4c-.4 3.4-.2 5.6.6 7.6" stroke="${SHEEN}" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M29.6 10.6c5-1.6 10.6-.4 13.8 3.4M30.8 14.2c4.4-.8 8.8.4 11.2 3.2M21.6 13.6c-1.6 1.6-2.8 3.6-3.4 6" stroke="${SHEEN}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`,
    face: `<path d="M21.8 26.4q3.4-1.6 6.6-.2M35.6 26.2q3.2-1.4 6.6.2" stroke="${BLACK}" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      <ellipse cx="25.6" cy="31.6" rx="1.7" ry="2" fill="${INK}"/><ellipse cx="38.4" cy="31.6" rx="1.7" ry="2" fill="${INK}"/>
      <circle cx="25.4" cy="31.6" r="4.7" fill="rgba(255,255,255,.16)" stroke="#2B2522" stroke-width="1.5"/>
      <circle cx="38.6" cy="31.6" r="4.7" fill="rgba(255,255,255,.16)" stroke="#2B2522" stroke-width="1.5"/>
      <path d="M30.1 31.2q1.9-1.3 3.8 0M20.7 30.6l-2.1-.6M43.3 30.6l2.1-.6" stroke="#2B2522" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M31.2 35.4q.8 1.4 1.8 1.2" stroke="${SKIN_D}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M27.2 40q4.8 3.6 9.6 0" stroke="#A4513A" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    extra: `<path d="M26 50.5l6 5.5 6-5.5" fill="none" stroke="#F1F5F9" stroke-width="2.2" stroke-linejoin="round"/>`
  },
  grandpa2: {
    label: '할아버지 (등산모)', body: '#4D6B3C', faceShape: FACE_SQUARE,
    hair: `<path d="M19 30.4c-.6-3.6-.2-6.6 1.4-8.6M45 30.4c.6-3.6.2-6.6-1.4-8.6" stroke="${BLACK}" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M16.2 23.6c1.2-8.6 7.6-13.4 15.8-13.4s14.6 4.8 15.8 13.4z" fill="#C4693E"/>
      <path d="M13.2 24.6c5.6-2.4 12-3.3 18.8-3.3s13.2.9 18.8 3.3c.6.3.4 1.4-.3 1.4H13.5c-.7 0-.9-1.1-.3-1.4z" fill="#A9552F"/>`,
    face: `<path d="M22.4 29q3-1.5 5.8.1M35.8 29.1q2.8-1.6 5.8-.1" stroke="${BLACK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="25.8" cy="33.2" rx="1.7" ry="2" fill="${INK}"/><ellipse cx="38.2" cy="33.2" rx="1.7" ry="2" fill="${INK}"/>
      <path d="M27.4 40.2q4.6 3.6 9.2 0" stroke="#A4513A" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    extra: ''
  },
  grandma: {
    label: '할머니 (컬 단발)', body: '#A9557A',
    // 턱선 길이 단발 + 끝부분 살짝 바깥으로 말린 컬

const $  = (s, el = document) => el.querySelector(s);

function loadSettings() {

/* =====================================================================
 * 3. 레코드 정규화 (탁구 전용)
 * ===================================================================== */
function normDate(v) {
  if (!v) return '';
  const s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { const d = new Date(s); return isNaN(d) ? s.slice(0, 10) : ymd(d); }
  if (/^\d{4}[./]\d{1,2}[./]\d{1,2}/.test(s)) { const [y, m, d] = s.split(/[./]/).map(Number); return `${y}-${pad(m)}-${pad(d)}`; }
  const d = new Date(s); return isNaN(d) ? '' : ymd(d);
}
const blankOrNum = v => (v === '' || v == null || !Number.isFinite(parseFloat(v))) ? '' : parseFloat(v);
function norm(r) {
  const x = {
    id: String(r.id ?? uid()),
    date: normDate(r.date),
    type: String(r.type || 'pingpong'),
    winner: '',
    husband_sets: Math.max(0, Math.round(num(r.husband_sets))),
    wife_sets:    Math.max(0, Math.round(num(r.wife_sets))),
    set_Diff: 0,
    score_detail: String(r.score_detail ?? ''),
    duration_min: blankOrNum(r.duration_min),      // 미사용 (기존 데이터 보존용)
    calories: blankOrNum(r.calories),              // 미사용 (기존 데이터 보존용)
    distance_km: '',
    memo: String(r.memo ?? ''),
    participant: 'together',
    updated_at: String(r.updated_at ?? '')
  };
  x.set_Diff = x.husband_sets - x.wife_sets;
  x.winner = x.set_Diff > 0 ? 'husband' : x.set_Diff < 0 ? 'wife' : 'draw';
  return x;
}
/** 탁구 기록만 사용 (시트에 남아 있는 달리기·자전거 행은 앱에서 무시) */
const isMatch = r => r && r.id && r.date && (r.type || 'pingpong') === 'pingpong';
const normList = list => list.filter(isMatch).map(norm).filter(r => r.date);
function finalize(r) { const x = norm({ ...r, type: 'pingpong' }); x.updated_at = new Date().toISOString(); return x; }

/* =====================================================================
 * 4. Google Apps Script API + 오프라인 대기열
 * ===================================================================== */
function fetchT(url, opt, ms = 25000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { ...opt, signal: c.signal }).finally(() => clearTimeout(t));
}
async function parseRes(res) {
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch { throw new Error(res.ok ? '응답 형식 오류 (웹 앱 배포/권한 설정 확인)' : 'HTTP ' + res.status); }
  if (!j.ok) throw new Error(j.error || '서버 오류');
  return j;
}
function netErr(e) {
  if (e.name === 'AbortError') return new Error('응답 시간 초과');
  if (e instanceof TypeError) return new Error('네트워크/CORS 오류 – 웹 앱 액세스 권한이 "모든 사용자"인지 확인');
  return e;
}
const api = {
  enabled() { return !!settings.gasUrl; },
  async get(params, url = settings.gasUrl, token = settings.token) {
    let u; try { u = new URL(url); } catch { throw new Error('웹 앱 URL 형식이 올바르지 않음'); }
    Object.entries({ ...params, token }).forEach(([k, v]) => { if (v) u.searchParams.set(k, v); });
    try { return await parseRes(await fetchT(u.toString(), { method: 'GET', redirect: 'follow' })); }
    catch (e) { throw netErr(e); }
  },
  async post(body, url = settings.gasUrl, token = settings.token) {
    try {
      // text/plain → CORS preflight 없이 전송 (GAS doPost에서 JSON.parse)
      return await parseRes(await fetchT(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token }) }));
    } catch (e) { throw netErr(e); }
  },
  async list() { return (await this.get({ action: 'list' })).data || []; }
};

let syncing = false;
function enqueue(op) { queue.push(op); store.set(K.queue, queue); flushQueue(); }
async function flushQueue() {
  if (!api.enabled() || !queue.length || syncing) return;
  syncing = true; setStatus('sync');
  const ops = queue.slice();
  let ok = false;
  try {
    await api.post({ action: 'batch', ops });
    queue = queue.slice(ops.length); store.set(K.queue, queue);
    ok = true; setStatus('ok');
  } catch (e) { setStatus('error', e.message); }
  finally { syncing = false; }
  if (ok && queue.length) return flushQueue();
}
function applyOpsLocal(list, ops) {
  const map = new Map(list.map(r => [r.id, r]));
  for (const o of ops) {
    if (o.op === 'delete') map.delete(String(o.id));
    else if (o.record) map.set(String(o.record.id), norm(o.record));
  }
  return [...map.values()];
}
async function refreshFromServer(silent = true) {
  if (!api.enabled()) return;
  await flushQueue();
  if (queue.length) return;            // 미전송 데이터 보호
  setStatus('sync');
  try {
    const data = await api.list();
    let list = normList(data);
    if (queue.length) list = applyOpsLocal(list, queue);
    records = list; persistRecords();
    store.del(K.sample); store.set(K.lastSync, Date.now());
    setStatus('ok'); renderAll();
    if (!silent) toast('Google Sheets와 동기화 완료', 'ok');
  } catch (e) {
    setStatus('error', e.message);
    if (!silent) toast('동기화 실패: ' + e.message, 'error');
  }
}

/* 저장/삭제 (낙관적 업데이트 → 대기열 → 시트 반영) */
function saveRecord(rec) {
  const x = finalize(rec);
  const i = records.findIndex(r => r.id === x.id);
  if (i >= 0) records[i] = x; else records.push(x);
  persistRecords(); renderAll();
  if (api.enabled()) enqueue({ op: 'upsert', record: x });
  return x;
}
function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  persistRecords(); renderAll();
  if (api.enabled()) enqueue({ op: 'delete', id });
}

function setStatus(s, msg = '') { syncState = s; syncMsg = msg; renderStatus(); }
function renderStatus() {
  const chip = $('#syncChip');
  const sample = store.get(K.sample, false) && records.some(isSample);
  let txt, cls = '';
  if (!api.enabled()) { txt = sample ? '🧪 샘플' : '📱 로컬'; }
  else if (syncState === 'sync') { txt = '⏳ 동기화'; }
  else if (syncState === 'error') { txt = `⚠️ 실패${queue.length ? ' · 대기 ' + queue.length : ''}`; cls = 'text-amber-300 border-amber-500/50'; }
  else { txt = queue.length ? `☁️ 대기 ${queue.length}` : '☁️ 연결됨'; cls = 'text-emerald-300 border-emerald-500/40'; }
  const sp = txt.indexOf(' ');
  chip.innerHTML = sp > 0 ? `${esc(txt.slice(0, sp))}<span class="hidden min-[400px]:inline">${esc(txt.slice(sp + 1))}</span>` : esc(txt);
  chip.setAttribute('aria-label', txt);
  chip.className = 'chip flex-none max-w-[30vw] overflow-hidden text-ellipsis ' + cls;
  chip.title = syncMsg || (api.enabled() ? '탭하여 지금 동기화' : '탭하여 Google Sheets 연결 설정');

/* =====================================================================
 * 5. 집계 / 통계
 * ===================================================================== */
const byDateId = (a, b) => a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id));
function matches() { return records.slice().sort(byDateId); }
function tally(list) {
  let h = 0, w = 0, d = 0;
  for (const r of list) { if (r.winner === 'husband') h++; else if (r.winner === 'wife') w++; else d++; }
  const n = list.length;
  return { n, h, w, d, hr: n ? h / n * 100 : 0, wr: n ? w / n * 100 : 0 };
}
function dayWinner(pp) {
  if (!pp.length) return null;
  const t = tally(pp);
  if (t.h !== t.w) return t.h > t.w ? 'husband' : 'wife';
  const diff = pp.reduce((s, r) => s + num(r.set_Diff), 0);
  return diff > 0 ? 'husband' : diff < 0 ? 'wife' : 'draw';
}
function dayMap() {
  const m = new Map();
  for (const r of records) { if (!m.has(r.date)) m.set(r.date, { pp: [] }); m.get(r.date).pp.push(r); }
  for (const d of m.values()) { d.pp.sort(byDateId); d.winner = dayWinner(d.pp); }
  return m;
}
function intervalStats() {
  const t = todayStr();
  const dates = [...new Set(records.map(r => r.date))].filter(d => d && d <= t).sort();
  if (dates.length < 2) return { recent: null, all: null, last: dates.length ? daysBetween(dates[0], t) : null, days: dates.length };
  const gaps = []; for (let i = 1; i < dates.length; i++) gaps.push(daysBetween(dates[i - 1], dates[i]));

/* =====================================================================

let modalZ = 60;
const modalStack = [];
let ignorePop = 0, guardPushed = false;
function pushGuard() { if (!guardPushed) { try { history.pushState({ ppModal: true }, ''); guardPushed = true; } catch {} } }
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; if (modalStack.length) { guardPushed = false; pushGuard(); } return; }
  guardPushed = false;

});
function openModal({ title, body = '', wide = false, onClose }) {

  wrap.className = 'modal-wrap'; wrap.style.zIndex = ++modalZ;
  wrap.innerHTML = `<div class="modal-backdrop"></div>
    <div class="modal-card ${wide ? 'sm:max-w-2xl' : 'sm:max-w-lg'}" role="dialog" aria-modal="true">

  const m = { el: wrap, body: bodyEl, closed: false, close };

function renderCalendar() {

  let html = '';

  const list = records.filter(r => histMonth === 'all' || r.date.startsWith(histMonth)).sort(byDateId).reverse();

function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function clearSample() {
  records = records.filter(r => !isSample(r)); store.del(K.sample); persistRecords(); renderAll(); toast('샘플 데이터를 삭제했습니다');
}
/** 새 GAS URL 연결: 시트가 비어 있고 이 폰에 실데이터가 있으면 업로드 제안 */
async function connectGas() {
  setStatus('sync');
  try {
    const raw = await api.list();
    const data = normList(raw);
    const real = records.filter(r => !isSample(r));
    if (!data.length && real.length) {
      if (await askConfirm(`연결된 시트가 비어 있습니다.\n이 폰의 경기 ${real.length}건을 시트에 업로드할까요?\n(취소 시 이 폰 기록은 백업 후 시트 데이터로 교체)`, { ok: '업로드' })) {
        queue = real.map(r => ({ op: 'upsert', record: r })); store.set(K.queue, queue);
        records = real; persistRecords(); store.del(K.sample);
        await flushQueue(); renderAll();
        toast(queue.length ? '업로드 실패 — 자동 재시도 예정' : `${real.length}건 업로드 완료`, queue.length ? 'warn' : 'ok');
        return;
      }
      store.set('pp.backup.' + Date.now(), real);
    }
    records = data; persistRecords(); store.del(K.sample); store.set(K.lastSync, Date.now());
    setStatus('ok'); renderAll();
    toast(`Google Sheets 연결 완료 · ${records.length}경기 불러옴`, 'ok');
  } catch (e) { setStatus('error', e.message); toast('연결 실패: ' + e.message, 'error'); }
}

/* =====================================================================
 * 14. 샘플 데이터 (최초 실행 / 시트 미연결 시)
 * ===================================================================== */
function makeSample() {
  const rnd = mulberry32(20261014), out = [];
  const today = new Date(); const d = new Date(today); d.setDate(d.getDate() - 120);
  let k = 0;
  while (d <= today) {
    if (rnd() < 0.75) {
      const pH = 0.5 + 0.18 * Math.sin(k / 12);
      const S = 10, hWin = rnd() < pH, lose = Math.floor(3 + rnd() * 7);   // 패자 3~9세트
      out.push({ id: 'sample-' + String(++k).padStart(5, '0'), date: ymd(d), type: 'pingpong',
        husband_sets: hWin ? S : lose, wife_sets: hWin ? lose : S, memo: rnd() < 0.08 ? '접전! 다음엔 설욕한다' : '' });
    }
    d.setDate(d.getDate() + 1 + Math.floor(rnd() * 3));
  }
  return out.map(norm);
}

/* =====================================================================
 * 15. 렌더 / 탭 / 이벤트 바인딩
 * ===================================================================== */
function renderAll() {
  renderCalendar(); renderHistory(); renderStatus(); renderDayModal();
  if (activeTab === 'stats') renderStats();
}
function switchTab(t) {
  activeTab = t;
  $$('#tabs .tab-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['score', 'stats', 'history'].forEach(x => { $('#tab-' + x).hidden = x !== t; });
  if (t === 'stats') renderStats();
  if (window.innerWidth < 1024) window.scrollTo({ top: Math.max(0, $('main').offsetTop - 64), behavior: 'smooth' });
}
function bindSeg(id, cb) {
  $$('#' + id + ' .seg-btn').forEach(b => b.onclick = () => {
    $$('#' + id + ' .seg-btn').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v);
  });
}

let deferredInstall = null;
function bind() {
  // 캘린더
  $('#calPrev').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); };
  $('#calNext').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); };
  $('#calToday').onclick = () => { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCalendar(); };
  $('#calToggle').onclick = () => { calCollapsed = !calCollapsed; store.set(K.cal, calCollapsed); renderCalendar(); };
  $('#calGrid').addEventListener('click', e => { const c = e.target.closest('[data-date]'); if (c) openDayModal(c.dataset.date); });
  let sx = null, sy = null;
  $('#calGrid').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#calGrid').addEventListener('touchend', e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? $('#calNext') : $('#calPrev')).click();
  });

  // 탭
  $$('#tabs .tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

  // 결과 입력
  $('#eBoard').addEventListener('click', e => {
    const p = e.target.closest('[data-plus]'), mi = e.target.closest('[data-minus]'), pk = e.target.closest('[data-pick]');
    if (mi) setScore(mi.dataset.minus, entry[KEY[mi.dataset.minus]] - 1);
    else if (p) setScore(p.dataset.plus, entry[KEY[p.dataset.plus]] + 1);
    else if (pk) openPicker(pk.dataset.pick);
  });
  $('#eReset').onclick = () => { entry.h = setsToWin(); entry.w = setsToWin(); saveEntry(); renderEntry(); };
  $('#eSave').onclick = saveMatch;
  $('#eDate').onchange = e => { entry.date = e.target.value || todayStr(); saveEntry(); };
  $('#eToday').onclick = () => { entry.date = todayStr(); saveEntry(); renderEntry(); };
  $('#eYest').onclick = () => { const d = new Date(); d.setDate(d.getDate() - 1); entry.date = ymd(d); saveEntry(); renderEntry(); };
  $('#eMemo').oninput = e => { entry.memo = e.target.value; saveEntry(); };

  // 통계
  bindSeg('segRange', v => { statsRange = +v; renderStats(); });
  bindSeg('segWr', v => { wrMode = v; renderStats(); });

  // 기록 관리
  $('#hMonth').onchange = e => { histMonth = e.target.value; histLimit = 40; renderHistory(); };
  $('#hMore').onclick = () => { histLimit += 40; renderHistory(); };
  $('#bBackdate').onclick = () => openRecordModal(null);

  // 수정/삭제 (이벤트 위임)
  document.addEventListener('click', async e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { const r = records.find(x => x.id === ed.dataset.edit); if (r) openRecordModal(r); return; }
    const dl = e.target.closest('[data-del]');
    if (dl) {
      const r = records.find(x => x.id === dl.dataset.del); if (!r) return;
      if (await askConfirm(`${fmtDateK(r.date)} 경기(${pairTxt({ h: r.husband_sets, w: r.wife_sets })})를 삭제할까요?`, { ok: '삭제', danger: true })) { deleteRecord(r.id); toast('삭제했습니다'); }
    }
  });

  // 헤더
  $('#btnSettings').onclick = openSettings;
  $('#syncChip').onclick = () => api.enabled() ? refreshFromServer(false) : openSettings();
  $('#btnClearSample').onclick = clearSample;

  // 홈 화면 설치 (갤럭시: Chrome / 삼성 인터넷)
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#btnInstall').hidden = false; });
  $('#btnInstall').onclick = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch {}
    deferredInstall = null; $('#btnInstall').hidden = true;
  };
  window.addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; toast('홈 화면에 설치되었습니다', 'ok'); });

  // 앱 복귀 시 1분 이상 지났으면 시트 재조회 (상대방 폰 변경분 반영)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (api.enabled() && Date.now() - store.get(K.lastSync, 0) > 60000) refreshFromServer(true);
  });
  window.addEventListener('online', () => flushQueue());
}

/* =====================================================================
 * 16. 초기화
 * ===================================================================== */
function init() {
  if (window.Chart) { Chart.defaults.color = '#cbd5e1'; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; }
  const saved = store.get(K.records, null);
  if (Array.isArray(saved)) { records = normList(saved); if (records.length !== saved.length) persistRecords(); }
  else if (!settings.gasUrl) { records = makeSample(); store.set(K.sample, true); persistRecords(); }   // 최초 실행: 샘플 모드
  saveSettings();
  if (!entry || entry.sets || !(entry.h >= 0) || entry.h > setsToWin() || entry.w > setsToWin()) entry = freshEntry(entry?.date);
  delete entry.duration; saveEntry();
  bind(); renderEntry(); renderAll();
  if (api.enabled()) refreshFromServer(true);
  // 오프라인 실행 / 홈 화면 앱 지원 (GitHub Pages 등 https 환경)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
}
init();

</script>
